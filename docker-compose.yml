version: '3.8'

services:
  # Main API Service
  water-analysis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water-analysis-api
    ports:
      - "8015:8000"
    environment:
      # From .env file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      
      # Application config
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_ENV=development
      - LOG_LEVEL=INFO
      
      # PHREEQC config (env-driven; supports MODE=test or MODE=vps)
      - MODE=${MODE:-test}
      - PHREEQC_EXECUTABLE_PATH=${PHREEQC_EXECUTABLE_PATH:-/usr/bin/phreeqc}
      - PHREEQC_EXECUTABLE_PATH_VPS=${PHREEQC_EXECUTABLE_PATH_VPS:-/usr/bin/phreeqc}
      - PHREEQC_DATABASE_PATH=${PHREEQC_DATABASE_PATH:-/app/data}
      - PHREEQC_DATABASE_PATH_VPS=${PHREEQC_DATABASE_PATH_VPS:-/phreeqc-3.8.6-17100/database}
      - PHREEQC_DEFAULT_DATABASE=${PHREEQC_DEFAULT_DATABASE:-phreeqc.dat}
      - PHREEQC_PITZER_DATABASE=${PHREEQC_PITZER_DATABASE:-pitzer.dat}
      - PHREEQC_DB_HOST_PATH=${PHREEQC_DB_HOST_PATH:-./phreeqc-3.8.6-17100/database}
      - PHREEQC_TIMEOUT=${PHREEQC_TIMEOUT:-120}
      
      # Feature flags
      - ENABLE_AI_SUGGESTIONS=true
      - ENABLE_PROMPT_BASED_GRAPHS=true
      
      # Rate limiting
      - RATE_LIMIT_OCR=10
      - RATE_LIMIT_ANALYSIS=20
    
    volumes:
      # Mount code for hot reload (development)
      - ./:/app
      # Persistent data
      - ./data:/app/data
      - ./logs:/app/logs
      # Optional host path for PHREEQC database (set PHREEQC_DB_HOST_PATH in .env on VPS)
      - ${PHREEQC_DB_HOST_PATH:-./phreeqc-3.8.6-17100/database}:/phreeqc-3.8.6-17100/database:ro
    
    env_file:
      - .env
    
    networks:
      - water-analysis-network
    
    restart: unless-stopped
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  water-analysis-network:
    driver: bridge